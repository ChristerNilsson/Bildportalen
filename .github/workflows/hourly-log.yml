name: Hourly time log

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-time:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Before script
        run: | 
          echo "Before script status: ${{ job.status }}"

      - name: Append current time
        run: python scripts/log_time.py

      - name: Commit log update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026.log
          if git diff --cached --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "Log hourly timestamp"
            git push
          fi

      - name: After script
        run: |
          echo "After script status: ${{ job.status }}"
